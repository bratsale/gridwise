server {
  listen 8080;
  root /usr/share/nginx/html;

  # The trailing slash in proxy_pass strips the /api/... prefix.
  location /api/catalog/ {
    proxy_pass http://catalog:8080/;
    proxy_connect_timeout 3s;
  }

  location /api/recommendation/ {
    proxy_pass http://recommendation:8080/;
    proxy_connect_timeout 3s;
  }

  # The progress stream of a job (server-sent events): no buffering, or the events would arrive in lumps,
  # and a long read timeout, or nginx would close an idle stream after 60 s.
  location ~ ^/api/batch/jobs/[^/]+/events$ {
    rewrite ^/api/batch/(.*)$ /$1 break;
    proxy_pass http://batch:8080;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_connect_timeout 3s;
    proxy_read_timeout 1h;
  }

  # CSV uploads reach the service, which enforces its own 10 MB limit (nginx's default of 1 MB would answer 413 first).
  location /api/batch/ {
    proxy_pass http://batch:8080/;
    proxy_connect_timeout 3s;
    client_max_body_size 11m;
  }

  location / {
    try_files $uri /index.html;
  }
}
