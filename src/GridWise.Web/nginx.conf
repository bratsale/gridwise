server {
  listen 8080;
  root /usr/share/nginx/html;

  # The trailing slash in proxy_pass strips the /api/... prefix.
  location /api/catalog/ {
    proxy_pass http://catalog:8080/;
    proxy_connect_timeout 3s;
  }

  location /api/recommendation/ {
    proxy_pass http://recommendation:8080/;
    proxy_connect_timeout 3s;
  }

  # CSV uploads reach the service, which enforces its own 10 MB limit (nginx's default of 1 MB would answer 413 first).
  location /api/batch/ {
    proxy_pass http://batch:8080/;
    proxy_connect_timeout 3s;
    client_max_body_size 11m;
  }

  location / {
    try_files $uri /index.html;
  }
}
