server {
  listen 8080;
  root /usr/share/nginx/html;

  # nginx resolves the name in a plain "proxy_pass http://catalog:8080" once, when it starts, and keeps that address.
  # When a container is recreated it can get a new address (and the old one can go to another container), so the
  # services are resolved at request time instead: the upstream is a variable, and the Docker DNS (127.0.0.11) is asked
  # again after 10 seconds. IPv6 is off because the compose network has none.
  # With a variable proxy_pass does not strip the location prefix, so every location removes /api/<service> with a rewrite.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /api/catalog/ {
    set $catalog http://catalog:8080;
    rewrite ^/api/catalog/(.*)$ /$1 break;
    proxy_pass $catalog;
    proxy_connect_timeout 3s;
  }

  location /api/recommendation/ {
    set $recommendation http://recommendation:8080;
    rewrite ^/api/recommendation/(.*)$ /$1 break;
    proxy_pass $recommendation;
    proxy_connect_timeout 3s;
  }

  # The progress stream of a job (server-sent events): no buffering, or the events would arrive in lumps,
  # and a long read timeout, or nginx would close an idle stream after 60 s.
  location ~ ^/api/batch/jobs/[^/]+/events$ {
    set $batch http://batch:8080;
    rewrite ^/api/batch/(.*)$ /$1 break;
    proxy_pass $batch;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_connect_timeout 3s;
    proxy_read_timeout 1h;
  }

  # CSV uploads reach the service, which enforces its own 10 MB limit (nginx's default of 1 MB would answer 413 first).
  location /api/batch/ {
    set $batch http://batch:8080;
    rewrite ^/api/batch/(.*)$ /$1 break;
    proxy_pass $batch;
    proxy_connect_timeout 3s;
    client_max_body_size 11m;
  }

  # Keycloak, which serves itself under /auth (KC_HTTP_RELATIVE_PATH), so the path is passed on unchanged (no rewrite).
  # Its public address is fixed by KC_HOSTNAME; the forwarded headers tell it the original client and scheme.
  # Login responses carry large cookies and headers, hence the bigger buffers.
  location /auth/ {
    set $keycloak http://keycloak:8080;
    proxy_pass $keycloak;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
    proxy_connect_timeout 3s;
  }

  location / {
    try_files $uri /index.html;
  }
}
