name: Promote

# Deploys images that are already built (by commit SHA) to qa or prod. Promotion and rollback are the same operation:
# promoting is deploying a newer SHA, rolling back is deploying an older one. Nothing is built here.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy to
        required: true
        type: choice
        options: [qa, prod]
      tag:
        description: Commit SHA whose images to deploy (the full 40 characters)
        required: true
        type: string

permissions:
  contents: read

# Two deployments to the same environment must not run at once.
concurrency:
  group: promote-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      actions: read # to read the CI/CD run of the SHA
    env:
      # Repository secrets named <ENVIRONMENT>_<NAME>, for example QA_CATALOG_DB_PASSWORD; the dev defaults when a secret is not set.
      CATALOG_DB_PASSWORD: ${{ secrets[format('{0}_CATALOG_DB_PASSWORD', inputs.environment)] || 'catalog_dev_pw' }}
      RECOMMENDATION_DB_PASSWORD: ${{ secrets[format('{0}_RECOMMENDATION_DB_PASSWORD', inputs.environment)] || 'recommendation_dev_pw' }}
      BATCH_DB_PASSWORD: ${{ secrets[format('{0}_BATCH_DB_PASSWORD', inputs.environment)] || 'batch_dev_pw' }}
      KAFKA_ADMIN_PASSWORD: ${{ secrets[format('{0}_KAFKA_ADMIN_PASSWORD', inputs.environment)] || 'kafka_admin_dev_pw' }}
      KAFKA_CATALOG_PASSWORD: ${{ secrets[format('{0}_KAFKA_CATALOG_PASSWORD', inputs.environment)] || 'catalog_kafka_dev_pw' }}
      KAFKA_RECOMMENDATION_PASSWORD: ${{ secrets[format('{0}_KAFKA_RECOMMENDATION_PASSWORD', inputs.environment)] || 'recommendation_kafka_dev_pw' }}
      KAFKA_BATCH_PASSWORD: ${{ secrets[format('{0}_KAFKA_BATCH_PASSWORD', inputs.environment)] || 'batch_kafka_dev_pw' }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Fails early, with a clear message, when the SHA was never built (a typo, a branch other than main, a deleted package).
      - name: Check that the images exist
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! [[ "$TAG" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The tag must be a full commit SHA (40 lowercase hexadecimal characters), got '$TAG'"
            exit 1
          fi
          missing=0
          for service in catalog recommendation batch gateway web; do
            image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/gridwise/$service:$TAG"
            if docker manifest inspect "$image" > /dev/null 2>&1; then
              echo "found   $image"
            else
              echo "::error::Image not found: $image"
              missing=1
            fi
          done
          exit $missing

      # Only a SHA whose CI/CD run passed completely (backend, web, images, e2e, deploy-dev) may reach qa or prod: images exist as soon
      # as backend and web pass, so their existence alone does not prove the e2e tests passed. The run must be the push to main, the one
      # that built the images and ran e2e; a branch or pull request run of the same commit skips those jobs and still ends as success.
      # If main has several runs for the commit, the newest counts; a re-run updates the conclusion of its run.
      - name: Check that CI/CD passed for this SHA
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$TAG" --branch main --event push --limit 1 \
            --json conclusion,status,url --jq '.[0] // empty')
          if [[ -z "$run" ]]; then
            echo "::error::No CI/CD run on main for $TAG. Only commits pushed to main are built and tested end to end."
            exit 1
          fi
          status=$(jq -r .status <<< "$run")
          conclusion=$(jq -r .conclusion <<< "$run")
          url=$(jq -r .url <<< "$run")
          if [[ "$status" != completed ]]; then
            echo "::error::The CI/CD run for $TAG has not finished yet (status: $status). Wait for it and start the promotion again: $url"
            exit 1
          fi
          if [[ "$conclusion" != success ]]; then
            echo "::error::The CI/CD run for $TAG did not succeed (conclusion: $conclusion). Only a fully green run may be promoted: $url"
            exit 1
          fi
          echo "CI/CD passed for $TAG: $url"

      - uses: ./.github/actions/deploy
        with:
          environment: ${{ inputs.environment }}
          tag: ${{ inputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}
