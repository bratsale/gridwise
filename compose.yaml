name: gridwise

services:
  catalog-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: catalog
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog_dev_pw 
    ports:
      - "5432:5432"                     
    volumes:
      - catalog-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog -d catalog"]
      interval: 5s
      timeout: 3s
      retries: 10

  catalog:
    build:
      context: .
      dockerfile: src/GridWise.Catalog/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Catalog: Host=catalog-db;Port=5432;Database=catalog;Username=catalog;Password=catalog_dev_pw
      Kafka__BootstrapServers: kafka:9092
    ports:
      - "5101:8080"
    depends_on:
      catalog-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  recommendation-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: recommendation
      POSTGRES_USER: recommendation
      POSTGRES_PASSWORD: recommendation_dev_pw
    ports:
      - "5433:5432"
    volumes:
      - recommendation-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recommendation -d recommendation"]
      interval: 5s
      timeout: 3s
      retries: 10

  recommendation:
    build:
      context: .
      dockerfile: src/GridWise.Recommendation/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Recommendation: Host=recommendation-db;Port=5432;Database=recommendation;Username=recommendation;Password=recommendation_dev_pw
      Kafka__BootstrapServers: kafka:9092
    ports:
      - "5102:8080"
    depends_on:
      recommendation-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  kafka:
    image: apache/kafka:4.4.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms256M"
    ports:
      - "9094:9094"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 5s
      retries: 20

  kafka-init:
    image: apache/kafka:4.4.0
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        create() {
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
            --partitions 3 --replication-factor 1 "$$@"
        }
        create --topic catalog.plan-events --config retention.ms=-1
        create --topic catalog.tax-group-events --config retention.ms=-1
        create --topic recommendation.events --config retention.ms=-1
        create --topic recommendation.dlq
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list

volumes:
  catalog-db-data:
  recommendation-db-data:
  kafka-data:
