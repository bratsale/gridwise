name: gridwise

services:
  catalog-db:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    environment:
      POSTGRES_DB: catalog
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD:-catalog_dev_pw}
    ports:
      - "${CATALOG_DB_PORT:-5432}:5432"
    volumes:
      - catalog-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog -d catalog"]
      interval: 5s
      timeout: 3s
      retries: 10

  catalog:
    build:
      context: .
      dockerfile: src/GridWise.Catalog/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Catalog: Host=catalog-db;Port=5432;Database=catalog;Username=catalog;Password=${CATALOG_DB_PASSWORD:-catalog_dev_pw}
      Kafka__BootstrapServers: kafka:9092
    ports:
      - "${CATALOG_PORT:-5101}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      catalog-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  recommendation-db:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    environment:
      POSTGRES_DB: recommendation
      POSTGRES_USER: recommendation
      POSTGRES_PASSWORD: ${RECOMMENDATION_DB_PASSWORD:-recommendation_dev_pw}
    ports:
      - "${RECOMMENDATION_DB_PORT:-5433}:5432"
    volumes:
      - recommendation-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recommendation -d recommendation"]
      interval: 5s
      timeout: 3s
      retries: 10

  recommendation:
    build:
      context: .
      dockerfile: src/GridWise.Recommendation/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Recommendation: Host=recommendation-db;Port=5432;Database=recommendation;Username=recommendation;Password=${RECOMMENDATION_DB_PASSWORD:-recommendation_dev_pw}
      Kafka__BootstrapServers: kafka:9092
    ports:
      - "${RECOMMENDATION_PORT:-5102}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      recommendation-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  batch-db:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    environment:
      POSTGRES_DB: batch
      POSTGRES_USER: batch
      POSTGRES_PASSWORD: ${BATCH_DB_PASSWORD:-batch_dev_pw}
    ports:
      - "${BATCH_DB_PORT:-5434}:5432"
    volumes:
      - batch-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U batch -d batch"]
      interval: 5s
      timeout: 3s
      retries: 10

  batch:
    build:
      context: .
      dockerfile: src/GridWise.Batch/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Batch: Host=batch-db;Port=5432;Database=batch;Username=batch;Password=${BATCH_DB_PASSWORD:-batch_dev_pw}
      Kafka__BootstrapServers: kafka:9092
    ports:
      - "${BATCH_PORT:-5103}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      batch-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  web:
    build:
      context: src/GridWise.Web
    ports:
      - "${WEB_PORT:-5100}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ > /dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      catalog:
        condition: service_healthy
      recommendation:
        condition: service_healthy
      batch:
        condition: service_healthy

  kafka:
    image: ${KAFKA_IMAGE:-apache/kafka:4.4.0}
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT:-9094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:--Xmx512M -Xms256M}
    ports:
      - "${KAFKA_EXTERNAL_PORT:-9094}:9094"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 5s
      retries: 20

  kafka-init:
    image: ${KAFKA_IMAGE:-apache/kafka:4.4.0}
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        create() {
          partitions=$$1
          shift
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
            --partitions $$partitions --replication-factor 1 "$$@"
        }
        create ${KAFKA_PARTITIONS:-3} --topic catalog.plan-events --config retention.ms=-1
        create ${KAFKA_PARTITIONS:-3} --topic catalog.tax-group-events --config retention.ms=-1
        create ${KAFKA_PARTITIONS:-3} --topic recommendation.events --config retention.ms=-1
        create ${KAFKA_PARTITIONS:-3} --topic recommendation.dlq
        create 6 --topic batch.chunks --config retention.ms=-1
        create ${KAFKA_PARTITIONS:-3} --topic batch.results --config retention.ms=-1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list

volumes:
  catalog-db-data:
  recommendation-db-data:
  batch-db-data:
  kafka-data:
