name: gridwise

# Bearer token settings, the same for the gateway and the three services: keys from Keycloak's internal address (plain HTTP inside
# the compose network), issuer = the public address of Keycloak, audience gridwise-api.
x-jwt: &jwt
  Jwt__MetadataAddress: http://keycloak:8080/auth/realms/gridwise/.well-known/openid-configuration
  Jwt__RequireHttpsMetadata: "false"
  Jwt__Issuer: ${KEYCLOAK_HOSTNAME:-http://localhost:${WEB_PORT:-5100}/auth}/realms/gridwise
  Jwt__Audience: gridwise-api

services:
  catalog-db:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    environment:
      POSTGRES_DB: catalog
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD:-catalog_dev_pw}
    ports:
      - "${CATALOG_DB_PORT:-5432}:5432"
    volumes:
      - catalog-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog -d catalog"]
      interval: 5s
      timeout: 3s
      retries: 10

  catalog:
    image: ${REGISTRY:-gridwise}/catalog:${TAG:-local}
    build:
      context: .
      dockerfile: src/GridWise.Catalog/Dockerfile
    environment:
      <<: *jwt
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      # Gss Encryption Mode=Disable: Npgsql would otherwise try Kerberos (GSSAPI) encryption first, which the Alpine images do not have
      # ("Error loading shared library libgssapi_krb5.so.2" at startup); the databases use passwords (SCRAM), not Kerberos.
      ConnectionStrings__Catalog: Host=catalog-db;Port=5432;Database=catalog;Username=catalog;Password=${CATALOG_DB_PASSWORD:-catalog_dev_pw};Gss Encryption Mode=Disable
      Kafka__BootstrapServers: kafka:9092
      # Its own Kafka user (SASL/SCRAM); without these settings the client would connect without logging in.
      Kafka__Username: catalog
      Kafka__Password: ${KAFKA_CATALOG_PASSWORD:-catalog_kafka_dev_pw}
      Kafka__SaslMechanism: SCRAM-SHA-512
      Logging__LogLevel__Default: ${LOG_LEVEL:-Information}
      OTEL_SERVICE_NAME: catalog
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-lgtm:4318}
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_METRIC_EXPORT_INTERVAL: 15000
    ports:
      - "${CATALOG_PORT:-5101}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      catalog-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  recommendation-db:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    environment:
      POSTGRES_DB: recommendation
      POSTGRES_USER: recommendation
      POSTGRES_PASSWORD: ${RECOMMENDATION_DB_PASSWORD:-recommendation_dev_pw}
    ports:
      - "${RECOMMENDATION_DB_PORT:-5433}:5432"
    volumes:
      - recommendation-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recommendation -d recommendation"]
      interval: 5s
      timeout: 3s
      retries: 10

  recommendation:
    image: ${REGISTRY:-gridwise}/recommendation:${TAG:-local}
    build:
      context: .
      dockerfile: src/GridWise.Recommendation/Dockerfile
    environment:
      <<: *jwt
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Recommendation: Host=recommendation-db;Port=5432;Database=recommendation;Username=recommendation;Password=${RECOMMENDATION_DB_PASSWORD:-recommendation_dev_pw};Gss Encryption Mode=Disable
      Kafka__BootstrapServers: kafka:9092
      # Its own Kafka user (SASL/SCRAM); without these settings the client would connect without logging in.
      Kafka__Username: recommendation
      Kafka__Password: ${KAFKA_RECOMMENDATION_PASSWORD:-recommendation_kafka_dev_pw}
      Kafka__SaslMechanism: SCRAM-SHA-512
      Logging__LogLevel__Default: ${LOG_LEVEL:-Information}
      OTEL_SERVICE_NAME: recommendation
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-lgtm:4318}
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_METRIC_EXPORT_INTERVAL: 15000
    ports:
      - "${RECOMMENDATION_PORT:-5102}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      recommendation-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  # The same image as recommendation (same name and tag; the build section is the same too, so a local build is cached), started in worker mode: only a consumer of batch.chunks (no HTTP, no migrations, no outbox publisher).
  recommendation-worker:
    image: ${REGISTRY:-gridwise}/recommendation:${TAG:-local}
    build:
      context: .
      dockerfile: src/GridWise.Recommendation/Dockerfile
    command: ["worker"]
    environment:
      ConnectionStrings__Recommendation: Host=recommendation-db;Port=5432;Database=recommendation;Username=recommendation;Password=${RECOMMENDATION_DB_PASSWORD:-recommendation_dev_pw};Gss Encryption Mode=Disable
      Kafka__BootstrapServers: kafka:9092
      # Its own Kafka user (SASL/SCRAM); without these settings the client would connect without logging in.
      Kafka__Username: recommendation
      Kafka__Password: ${KAFKA_RECOMMENDATION_PASSWORD:-recommendation_kafka_dev_pw}
      Kafka__SaslMechanism: SCRAM-SHA-512
      Logging__LogLevel__Default: ${LOG_LEVEL:-Information}
      OTEL_SERVICE_NAME: recommendation-worker
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-lgtm:4318}
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_METRIC_EXPORT_INTERVAL: 15000
    deploy:
      replicas: 2
    depends_on:
      recommendation:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  batch-db:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    environment:
      POSTGRES_DB: batch
      POSTGRES_USER: batch
      POSTGRES_PASSWORD: ${BATCH_DB_PASSWORD:-batch_dev_pw}
    ports:
      - "${BATCH_DB_PORT:-5434}:5432"
    volumes:
      - batch-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U batch -d batch"]
      interval: 5s
      timeout: 3s
      retries: 10

  batch:
    image: ${REGISTRY:-gridwise}/batch:${TAG:-local}
    build:
      context: .
      dockerfile: src/GridWise.Batch/Dockerfile
    environment:
      <<: *jwt
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Batch: Host=batch-db;Port=5432;Database=batch;Username=batch;Password=${BATCH_DB_PASSWORD:-batch_dev_pw};Gss Encryption Mode=Disable
      Kafka__BootstrapServers: kafka:9092
      # Its own Kafka user (SASL/SCRAM); without these settings the client would connect without logging in.
      Kafka__Username: batch
      Kafka__Password: ${KAFKA_BATCH_PASSWORD:-batch_kafka_dev_pw}
      Kafka__SaslMechanism: SCRAM-SHA-512
      Logging__LogLevel__Default: ${LOG_LEVEL:-Information}
      OTEL_SERVICE_NAME: batch
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-lgtm:4318}
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_METRIC_EXPORT_INTERVAL: 15000
    ports:
      - "${BATCH_PORT:-5103}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      batch-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  # The API gateway (YARP): the single entry for /api/*. It forwards /api/<service>/... to the service with the prefix removed.
  # Routes are in src/GridWise.Gateway/appsettings.json; the addresses of the services are set here.
  gateway:
    image: ${REGISTRY:-gridwise}/gateway:${TAG:-local}
    build:
      context: .
      dockerfile: src/GridWise.Gateway/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      Logging__LogLevel__Default: ${LOG_LEVEL:-Information}
      OTEL_SERVICE_NAME: gateway
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-lgtm:4318}
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_METRIC_EXPORT_INTERVAL: 15000
      ReverseProxy__Clusters__catalog__Destinations__main__Address: http://catalog:8080/
      ReverseProxy__Clusters__recommendation__Destinations__main__Address: http://recommendation:8080/
      ReverseProxy__Clusters__batch__Destinations__main__Address: http://batch:8080/
      <<: *jwt
      # nginx's fixed address on the edge network: the only sender whose X-Forwarded-For is believed.
      ForwardedHeaders__KnownProxies__0: ${WEB_EDGE_IP:-172.30.0.10}
    # Published for debugging only; the browser goes through web (nginx).
    ports:
      - "${GATEWAY_PORT:-5104}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    depends_on:
      keycloak:
        condition: service_healthy
      catalog:
        condition: service_healthy
      recommendation:
        condition: service_healthy
      batch:
        condition: service_healthy
    networks:
      - default
      - edge

  web:
    image: ${REGISTRY:-gridwise}/web:${TAG:-local}
    build:
      context: src/GridWise.Web
    ports:
      - "${WEB_PORT:-5100}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ > /dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      gateway:
        condition: service_healthy
    # Only on the edge network, with a fixed address the gateway trusts for X-Forwarded-For.
    networks:
      edge:
        ipv4_address: ${WEB_EDGE_IP:-172.30.0.10}

  # Identity provider (OpenID Connect), served by the web container's nginx at /auth so the browser and the token issuer use one
  # address: http://localhost:5100/auth/realms/gridwise. Dev mode with its embedded database (no extra PostgreSQL): the realm is
  # imported from keycloak/realm-gridwise.json at every start of a new container. Memory: the JVM heap is capped at 384 MB and the
  # container at 700 MB.
  keycloak:
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.8.2}
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-kcadmin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-kcadmin_dev_pw}
      KC_HTTP_RELATIVE_PATH: /auth
      # The public address (through nginx). It follows WEB_PORT, so the issuer is right in every environment.
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-http://localhost:${WEB_PORT:-5100}/auth}
      # Called from inside the network (the gateway reads the keys at http://keycloak:8080), Keycloak answers with backchannel
      # URLs (jwks_uri, token endpoint) on that address; the issuer stays the public one above.
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      JAVA_OPTS_APPEND: -Xms128m -Xmx384m
    mem_limit: 700m
    volumes:
      - ./keycloak/realm-gridwise.json:/opt/keycloak/data/import/realm-gridwise.json:ro
    # Health is on the management port 9000, under the relative path. The image has no curl or wget, so bash's /dev/tcp asks.
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /auth/health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 30s
    networks:
      - default
      - edge

  # Grafana, Tempo (traces), Loki (logs) and Prometheus/Mimir (metrics) in one container, with an OTLP receiver (4317 gRPC, 4318 HTTP).
  # The services send to it inside the network; only Grafana is published. It is the heaviest part of the system: about 0.6 GB of memory (measured when idle; it grows with the amount of data kept)
  # and an image of about 1 GB. Nothing depends on it, so the services also run when it is stopped.
  otel-lgtm:
    image: ${OTEL_LGTM_IMAGE:-grafana/otel-lgtm:0.40.0}
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - otel-lgtm-data:/data
      # The GridWise dashboard and alert rules, provisioned from the repository (observability/grafana) when Grafana starts.
      - ./observability/grafana/provisioning/dashboards/gridwise.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/gridwise.yaml:ro
      - ./observability/grafana/provisioning/alerting/gridwise.yaml:/otel-lgtm/grafana/conf/provisioning/alerting/gridwise.yaml:ro
      - ./observability/grafana/dashboards:/otel-lgtm/gridwise-dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/health > /dev/null && curl -fsS http://localhost:3200/ready > /dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  # Every client logs in with its own SASL/SCRAM-SHA-512 user (catalog, recommendation, batch, kafka-admin for kafka-init and tools);
  # kafka/start.sh creates the users; kafka-init gives each one access to its own topics only (ACLs).
  # The listeners: INTERNAL (kafka:9092, the services) and EXTERNAL (localhost:9094, the host) need a login. BROKER and CONTROLLER
  # are bound to 127.0.0.1 inside the container (the broker talking to itself, and the tools in kafka/start.sh), unreachable from
  # the network. Without TLS (SASL_PLAINTEXT) the traffic is not encrypted: production would use SASL_SSL.
  kafka:
    image: ${KAFKA_IMAGE:-apache/kafka:4.4.0}
    entrypoint: ["bash", "/opt/gridwise/start.sh"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,BROKER://127.0.0.1:9095,CONTROLLER://127.0.0.1:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT:-9094},BROKER://localhost:9095
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,BROKER:PLAINTEXT,INTERNAL:SASL_PLAINTEXT,EXTERNAL:SASL_PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: BROKER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_SASL_ENABLED_MECHANISMS: SCRAM-SHA-512
      # Authorization: nothing is allowed unless an ACL allows it (kafka-init creates them).
      # Super users: kafka-admin (kafka-init, tools), and User:ANONYMOUS, the principal of the PLAINTEXT listeners BROKER and
      # CONTROLLER. Those are bound to 127.0.0.1 inside this container, so nothing on the network can connect to them: only the
      # broker itself and commands run with docker exec in this container, and whoever can exec here controls Kafka anyway.
      # The SASL listeners never give ANONYMOUS: a client there is a logged-in user or nothing.
      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "false"
      KAFKA_SUPER_USERS: User:kafka-admin;User:ANONYMOUS
      # The image turns ___ into - and _ into . : listener.name.internal.scram-sha-512.sasl.jaas.config
      KAFKA_LISTENER_NAME_INTERNAL_SCRAM___SHA___512_SASL_JAAS_CONFIG: org.apache.kafka.common.security.scram.ScramLoginModule required;
      KAFKA_LISTENER_NAME_EXTERNAL_SCRAM___SHA___512_SASL_JAAS_CONFIG: org.apache.kafka.common.security.scram.ScramLoginModule required;
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:--Xmx512M -Xms256M}
      # The users' passwords (read by kafka/start.sh).
      KAFKA_ADMIN_PASSWORD: ${KAFKA_ADMIN_PASSWORD:-kafka_admin_dev_pw}
      KAFKA_CATALOG_PASSWORD: ${KAFKA_CATALOG_PASSWORD:-catalog_kafka_dev_pw}
      KAFKA_RECOMMENDATION_PASSWORD: ${KAFKA_RECOMMENDATION_PASSWORD:-recommendation_kafka_dev_pw}
      KAFKA_BATCH_PASSWORD: ${KAFKA_BATCH_PASSWORD:-batch_kafka_dev_pw}
    ports:
      - "${KAFKA_EXTERNAL_PORT:-9094}:9094"
    volumes:
      - kafka-data:/var/lib/kafka/data
      - ./kafka/start.sh:/opt/gridwise/start.sh:ro
    healthcheck:
      # Healthy once the users exist (start.sh) and the broker answers.
      test: ["CMD-SHELL", "test -f /tmp/scram-users-ready && KAFKA_HEAP_OPTS=-Xmx64m /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9095 > /dev/null"]
      interval: 5s
      retries: 30

  kafka-init:
    image: ${KAFKA_IMAGE:-apache/kafka:4.4.0}
    environment:
      KAFKA_ADMIN_PASSWORD: ${KAFKA_ADMIN_PASSWORD:-kafka_admin_dev_pw}
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        # Logs in as kafka-admin (the tools' user).
        printf '%s\n' 'security.protocol=SASL_PLAINTEXT' 'sasl.mechanism=SCRAM-SHA-512' \
          "sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username=\"kafka-admin\" password=\"$$KAFKA_ADMIN_PASSWORD\";" \
          > /tmp/admin-client.properties
        create() {
          partitions=$$1
          shift
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --command-config /tmp/admin-client.properties --create --if-not-exists \
            --partitions $$partitions --replication-factor 1 "$$@"
        }
        create ${KAFKA_PARTITIONS:-3} --topic catalog.plan-events --config retention.ms=-1
        create ${KAFKA_PARTITIONS:-3} --topic catalog.tax-group-events --config retention.ms=-1
        create ${KAFKA_PARTITIONS:-3} --topic recommendation.events --config retention.ms=-1
        create ${KAFKA_PARTITIONS:-3} --topic recommendation.dlq
        create 6 --topic batch.chunks --config retention.ms=-1
        create ${KAFKA_PARTITIONS:-3} --topic batch.results --config retention.ms=-1
        create ${KAFKA_PARTITIONS:-3} --topic batch.dlq
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --command-config /tmp/admin-client.properties --list

        # Least privilege: each service may use its own topics and consumer groups, nothing else (see docs/events/README.md).
        # Write and Read include Describe. An idempotent producer needs no cluster permission: Write on a topic is enough.
        # Adding an ACL that exists is a no-op, so this runs at every start.
        acl() { /opt/kafka/bin/kafka-acls.sh --bootstrap-server kafka:9092 --command-config /tmp/admin-client.properties --add "$$@" > /dev/null; }
        acl --allow-principal User:catalog --operation Write --topic catalog.plan-events --topic catalog.tax-group-events
        acl --allow-principal User:recommendation --operation Read \
          --topic catalog.plan-events --topic catalog.tax-group-events --topic batch.chunks --topic recommendation.dlq
        acl --allow-principal User:recommendation --operation Write --topic recommendation.events --topic recommendation.dlq --topic batch.results
        acl --allow-principal User:recommendation --operation Read --group recommendation --group batch-workers --group recommendation-dlq-reprocess
        acl --allow-principal User:batch --operation Write --topic batch.chunks --topic batch.dlq
        acl --allow-principal User:batch --operation Read --topic batch.results --topic batch.dlq
        acl --allow-principal User:batch --operation Read --group batch --group batch-dlq-reprocess
        /opt/kafka/bin/kafka-acls.sh --bootstrap-server kafka:9092 --command-config /tmp/admin-client.properties --list

volumes:
  catalog-db-data:
  recommendation-db-data:
  batch-db-data:
  kafka-data:
  otel-lgtm-data:

networks:
  default: {}
  # Between nginx (web) and what it proxies to (gateway, keycloak). A fixed subnet, so nginx has a fixed address there.
  edge:
    ipam:
      config:
        - subnet: ${EDGE_SUBNET:-172.30.0.0/24}
